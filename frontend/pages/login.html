
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BodySynk Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<header class="p-3 border-bottom">
    <a href="/" class="text-decoration-none text-light">←　🟢 BodySynk</a>
</header>

<div class="container login text-center">
    <h1>Welcome to BodySynk</h1>
    <p class="text-secondary mb-5">Sign in to your health profile.</p>

    <form>
        <input type="email" class="form-control mb-3"
               placeholder="✉  you@example.com" required>

        <input type="password" class="form-control mb-3"
               placeholder="Password" required>

        <button class="btn btn-success w-100 rounded-pill p-3">
            → Sign in
        </button>
    </form>

    <div class="d-flex justify-content-between mt-3">
        <a href="#" class="text-secondary">Forgot password?</a>
        <a href="#" class="text-secondary">Email me a sign-in link</a>
    </div>

    <p class="mt-5 text-secondary">
        New here? <a href="/register" class="text-light">Create account</a>
    </p>
</div>

</body>
</html>
