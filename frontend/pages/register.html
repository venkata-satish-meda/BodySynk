
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign Up - BodySynk</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<header class="p-3 border-bottom">
    <a href="/" class="text-decoration-none text-light">←　🟢 BodySynk</a>
</header>

<div class="container login text-center">
    <h1>Create your account</h1>
    <p class="text-secondary mb-4">
        Start your personal health journey.
    </p>

    <form action="/register" method="POST">
        <input type="text" name="name"
               class="form-control mb-3"
               placeholder="Full name" required>

        <input type="email" name="email"
               class="form-control mb-3"
               placeholder="Email address" required>

        <input type="password" name="password"
               class="form-control mb-3"
               placeholder="Create password"
               minlength="8" required>

        <input type="password" name="confirm_password"
               class="form-control mb-3"
               placeholder="Confirm password"
               minlength="8" required>

        <button type="submit"
                class="btn btn-success w-100 rounded-pill p-3">
            Create account →
        </button>
    </form>

    <p class="mt-4 text-secondary">
        Already have an account?
        <a href="/login" class="text-light">Sign in</a>
    </p>
</div>

</body>
</html>
